[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnarm"
version = "0.1.0"
description = "Zero-Support MNAR Multimodal Continual Learning and Cross-Modal Density Transport"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "transformers==4.57.6",
    "datasets>=2.21.0",
    "pillow>=10.0.0",
    "PyYAML>=6.0.0",
    "scipy>=1.11.0",
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "nbformat>=5.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
